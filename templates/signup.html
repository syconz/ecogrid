{% extends "base.html" %}
{% block content %}
<div class="home-hero">
    <div class="hero-text">
        <h1>Create your account.</h1>
        <p class="hero-subtitle">
            Sign up to start tracking your energy predictions and building your usage history.
        </p>
    </div>

    <div class="login-card card">
        <h2>Sign Up</h2>
        {% if error %}
        <p class="form-error">{{ error }}</p>
        {% endif %}
        <form method="POST" action="{{ url_for('signup') }}" class="login-form">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Choose a username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6">

            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required minlength="6">

            <button type="submit" class="btn-primary">Sign Up</button>
        </form>
        <p class="login-hint">Already have an account? <a href="{{ url_for('home') }}">Log in</a></p>
    </div>
</div>
{% endblock %}
